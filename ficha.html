<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Ficha do Investigador - AMESTIA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="perfil.css">
    <link rel="stylesheet" href="ficha.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html">Início</a>
            <a href="biblioteca.html">Biblioteca</a>
            <a href="perfil.html">Personagens</a>
            <a href="criador.html">Criar Personagem</a>
            <a href="campanhas.html">Campanhas</a>
            <a href="bancodedados.html">Banco de Dados</a>
            <a href="comunidade.html">Comunidade</a>
        </div>
        <div class="nav-right">
            <button id="audioToggle" title="Mutar/Desmutar Música"><i class="fas fa-music"></i></button>
            <a href="#"><i class="fas fa-search"></i></a>
            <a href="#"><i class="fas fa-bell"></i></a>
            <a href="usuario.html" class="profile-link">Perfil <i class="fas fa-user-circle"></i></a>
        </div>
    </nav>

    <div class="sheet-container">
        <a href="perfil.html" class="btn-back"><i class="fas fa-arrow-left"></i> Voltar ao Cofre</a>

        <header class="sheet-header">
            <div class="character-portrait" id="ficha-foto" style="background-image: url('default.jpg');"></div>
            <div class="character-identity">
    <input type="text" id="ficha-nome" class="char-title-input" value="Nome do Personagem">
    <input type="text" id="ficha-conceito" class="char-subtitle-input" value="Conceito | Caminho">
    <div class="char-meta">
        <!-- Substituímos o input do Grau por controles interativos -->
        <span class="grau-control-group">
            <strong>Grau:</strong> 
            <button class="btn-ctrl-small" onclick="changeGrau(-1)">-</button>
            <span id="grau-display" class="highlight-val">1</span>
            <button class="btn-ctrl-small" onclick="changeGrau(1)">+</button>
        </span>
        <span><strong>Ocupação:</strong> <input type="text" id="ficha-ocupacao" value="Ocupação" class="meta-input text-input"></span>
    </div>
</div>
        </header>

        <div class="sheet-grid">
            <div class="sheet-column">
                
                <!-- Pilares de Sobrevivência Interativos -->
                <section class="sheet-section survival-section">
                    <h2>Pilares de Sobrevivência</h2>
                    
                    <!-- Vitalidade -->
                    <div class="status-bar-container">
                        <div class="status-header">
                            <label>Vitalidade (Proeza)</label>
                            <div class="status-controls">
                                <button class="btn-ctrl" onclick="changeBar('hp', -1)">-</button>
                                <span><span id="hp-val">0</span> / <span id="hp-max">0</span></span>
                                <button class="btn-ctrl" onclick="changeBar('hp', 1)">+</button>
                            </div>
                        </div>
                        <div class="status-bar health-bar">
                            <div id="hp-bar-fill" class="bar-fill" style="width: 100%;"></div>
                        </div>
                    </div>

                    <!-- Sanidade -->
                    <div class="status-bar-container">
                        <div class="status-header">
                            <label>Sanidade (Âncora)</label>
                            <div class="status-controls">
                                <button class="btn-ctrl" onclick="changeBar('san', -1)">-</button>
                                <span><span id="san-val">0</span> / <span id="san-max">0</span></span>
                                <button class="btn-ctrl" onclick="changeBar('san', 1)">+</button>
                            </div>
                        </div>
                        <div class="status-bar sanity-bar">
                            <div id="san-bar-fill" class="bar-fill" style="width: 100%;"></div>
                        </div>
                    </div>

                    <!-- Fluxo -->
                    <div class="status-bar-container">
                        <div class="status-header">
                            <label>Fluxo (Grau + Âncora)</label>
                            <div class="status-controls">
                                <button class="btn-ctrl" onclick="changeBar('fluxo', -1)">-</button>
                                <span><span id="fluxo-val">0</span> / <span id="fluxo-max">0</span></span>
                                <button class="btn-ctrl" onclick="changeBar('fluxo', 1)">+</button>
                            </div>
                        </div>
                        <div class="status-bar flow-bar">
                            <div id="fluxo-bar-fill" class="bar-fill" style="width: 100%;"></div>
                        </div>
                    </div>

                    <!-- Estresse Akedôntico -->
                    <div class="status-bar-container mt-3">
                        <div class="status-header">
                            <label>Estresse Akedôntico</label>
                            <div class="status-controls">
                                <button class="btn-ctrl" onclick="changeStress(-1)">-</button>
                                <span><span id="stress-val">0</span> / 8</span>
                                <button class="btn-ctrl" onclick="changeStress(1)">+</button>
                            </div>
                        </div>
                        <div class="stress-track" id="stress-track">
                            <div class="stress-mark"></div><div class="stress-mark"></div>
                            <div class="stress-mark"></div><div class="stress-mark"></div>
                            <div class="stress-mark"></div><div class="stress-mark"></div>
                            <div class="stress-mark"></div><div class="stress-mark"></div>
                        </div>
                    </div>
                </section>
                
                <section class="sheet-section innate-section">
                    <h2>Habilidade Inata</h2>
                    <textarea id="ficha-habilidade-inata" class="inline-input w-100" style="resize: vertical; min-height: 60px; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 6px; font-family: 'Inter', sans-serif; line-height: 1.5;"></textarea>
                </section>

                <!-- Atributos Mortais Interativos -->
<section class="sheet-section attributes-section">
    <h2>Atributos Mortais</h2>
    <div class="attributes-grid">
        <div class="attr-box">
            <span class="attr-name">Proeza</span>
            <div class="attr-controls">
                <button class="btn-ctrl-small" onclick="changeAttr('proeza', -1)">-</button>
                <span id="attr-proeza-display" class="attr-val">1</span>
                <button class="btn-ctrl-small" onclick="changeAttr('proeza', 1)">+</button>
            </div>
        </div>
        <div class="attr-box">
            <span class="attr-name">Percepção</span>
            <div class="attr-controls">
                <button class="btn-ctrl-small" onclick="changeAttr('percepcao', -1)">-</button>
                <span id="attr-percepcao-display" class="attr-val">1</span>
                <button class="btn-ctrl-small" onclick="changeAttr('percepcao', 1)">+</button>
            </div>
        </div>
        <div class="attr-box">
            <span class="attr-name">Cognição</span>
            <div class="attr-controls">
                <button class="btn-ctrl-small" onclick="changeAttr('cognicao', -1)">-</button>
                <span id="attr-cognicao-display" class="attr-val">1</span>
                <button class="btn-ctrl-small" onclick="changeAttr('cognicao', 1)">+</button>
            </div>
        </div>
        <div class="attr-box">
            <span class="attr-name">Influência</span>
            <div class="attr-controls">
                <button class="btn-ctrl-small" onclick="changeAttr('influencia', -1)">-</button>
                <span id="attr-influencia-display" class="attr-val">1</span>
                <button class="btn-ctrl-small" onclick="changeAttr('influencia', 1)">+</button>
            </div>
        </div>
        <div class="attr-box attribute-anchor">
            <span class="attr-name">Âncora</span>
            <div class="attr-controls">
                <button class="btn-ctrl-small" onclick="changeAttr('ancora', -1)">-</button>
                <span id="attr-ancora-display" class="attr-val">1</span>
                <button class="btn-ctrl-small" onclick="changeAttr('ancora', 1)">+</button>
            </div>
        </div>
    </div>
</section>

                <section class="sheet-section inventory-section">
    <div class="inventory-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="border: none; margin: 0; padding: 0;">Inventário</h2>
        <span style="color: var(--text-secondary); font-size: 0.9rem;">Slots: <strong id="slots-max" style="color: var(--accent-blue);">3</strong></span>
    </div>
    <button class="btn-add" onclick="addInventoryItem()" style="margin-bottom: 1rem;">+ Novo Item</button>
    
    <!-- Deixe esta div vazia, o JS vai renderizar os itens salvos aqui -->
    <div class="inventory-list" id="inventory-list"></div>
</section>

            </div>
        </div>
    </div>

    <script>
let personagemAtual = null;

window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const personagemId = urlParams.get('id');

    if (!personagemId) {
        alert("Nenhum personagem selecionado!");
        window.location.href = "perfil.html";
        return;
    }

    // 1. Busca primeiro o personagem no localStorage
    const bancoDePersonagens = JSON.parse(localStorage.getItem('amestia_personagens')) || [];
    personagemAtual = bancoDePersonagens.find(p => p.id == personagemId);

    if (!personagemAtual) {
        alert("Personagem não encontrado!");
        window.location.href = "perfil.html";
        return;
    }

    // 2. Garante que os objetos internos existam
    personagemAtual.atributos = personagemAtual.atributos || { proeza: 1, percepcao: 1, cognicao: 1, influencia: 1, ancora: 1 };
    personagemAtual.ancorasLiterais = personagemAtual.ancorasLiterais || { pessoa: "", lugar: "", objeto: "" };
    personagemAtual.inventario = personagemAtual.inventario || [];
    personagemAtual.estresse = personagemAtual.estresse || 0;
    personagemAtual.grau = personagemAtual.grau || 1;

    // 3. Calcula limites de vitalidade, sanidade, fluxo e slots
    recalcularLimites();

    if(personagemAtual.vitalidade === undefined) personagemAtual.vitalidade = personagemAtual.maxVit;
    if(personagemAtual.sanidade === undefined) personagemAtual.sanidade = personagemAtual.maxSan;
    if(personagemAtual.fluxo === undefined) personagemAtual.fluxo = personagemAtual.maxFluxo;

    // 4. Preenche os campos da interface
    document.getElementById('ficha-nome').value = personagemAtual.nome || "Desconhecido";
    document.getElementById('ficha-conceito').value = personagemAtual.conceito || "";
    document.getElementById('grau-display').innerText = personagemAtual.grau;
    document.getElementById('ficha-ocupacao').value = personagemAtual.ocupacao || "";
    document.getElementById('ficha-habilidade-inata').value = personagemAtual.habilidadeInata || "";

    // Preenche Âncoras
    document.getElementById('ancora-pessoa').value = personagemAtual.ancorasLiterais.pessoa || "";
    document.getElementById('ancora-lugar').value = personagemAtual.ancorasLiterais.lugar || "";
    document.getElementById('ancora-objeto').value = personagemAtual.ancorasLiterais.objeto || "";

    // Foto do personagem
    if (personagemAtual.imagem) {
        document.getElementById('ficha-foto').style.backgroundImage = `url('${personagemAtual.imagem}')`;
    }

    // Renderiza Atributos, Inventário e Barras
    atualizarExibicaoAtributos();
    renderizarInventario();
    atualizarTodasAsBarras();
    atualizarEstresseVisual(personagemAtual.estresse);
    
    // Inicia ouvintes de salvamento automático
    configurarAutoSave();
};

// Modificar Atributos (Proeza, Percepção, etc.)
window.changeAttr = function(attr, delta) {
    if (!personagemAtual || !personagemAtual.atributos) return;

    let valorAtual = parseInt(personagemAtual.atributos[attr]) || 1;
    let novoValor = valorAtual + delta;
    
    if (novoValor < 1) novoValor = 1;
    if (novoValor > 10) novoValor = 10;

    personagemAtual.atributos[attr] = novoValor;

    recalcularLimites();
    atualizarExibicaoAtributos();
    atualizarTodasAsBarras();
    salvarAlteracoesNoBanco();
};

function atualizarExibicaoAtributos() {
    const attrs = ['proeza', 'percepcao', 'cognicao', 'influencia', 'ancora'];
    attrs.forEach(attr => {
        const el = document.getElementById(`attr-${attr}-display`);
        if (el) el.innerText = personagemAtual.atributos[attr] || 1;
    });
}

function recalcularLimites() {
    const pro = parseInt(personagemAtual.atributos.proeza) || 1;
    const anc = parseInt(personagemAtual.atributos.ancora) || 1;
    const grau = parseInt(personagemAtual.grau) || 1;

    personagemAtual.maxVit = 10 + (pro * 5);
    personagemAtual.maxSan = 10 + (anc * 5);
    personagemAtual.maxFluxo = 3 + grau + anc;
    personagemAtual.maxSlots = 3 + pro;

    document.getElementById('hp-max').innerText = personagemAtual.maxVit;
    document.getElementById('san-max').innerText = personagemAtual.maxSan;
    document.getElementById('fluxo-max').innerText = personagemAtual.maxFluxo;
    document.getElementById('slots-max').innerText = personagemAtual.maxSlots;

    if(personagemAtual.vitalidade > personagemAtual.maxVit) personagemAtual.vitalidade = personagemAtual.maxVit;
    if(personagemAtual.sanidade > personagemAtual.maxSan) personagemAtual.sanidade = personagemAtual.maxSan;
    if(personagemAtual.fluxo > personagemAtual.maxFluxo) personagemAtual.fluxo = personagemAtual.maxFluxo;
}

function atualizarTodasAsBarras() {
    atualizarBarraVisual('hp', personagemAtual.vitalidade, personagemAtual.maxVit);
    atualizarBarraVisual('san', personagemAtual.sanidade, personagemAtual.maxSan);
    atualizarBarraVisual('fluxo', personagemAtual.fluxo, personagemAtual.maxFluxo);
}

function atualizarBarraVisual(stat, valor, max) {
    document.getElementById(stat + '-val').innerText = valor;
    const barElement = document.getElementById(stat + '-bar-fill');
    const percentage = Math.max(0, Math.min(100, (valor / max) * 100));
    barElement.style.width = percentage + '%';
}

function atualizarEstresseVisual(valor) {
    document.getElementById('stress-val').innerText = valor;
    const marks = document.getElementById('stress-track').children;
    for (let i = 0; i < marks.length; i++) {
        if (i < valor) marks[i].classList.add('filled');
        else marks[i].classList.remove('filled');
    }
}

window.changeBar = function(stat, delta) {
    if(!personagemAtual) return;
    let valorAtual = 0, max = 0;

    if(stat === 'hp') { valorAtual = personagemAtual.vitalidade; max = personagemAtual.maxVit; }
    if(stat === 'san') { valorAtual = personagemAtual.sanidade; max = personagemAtual.maxSan; }
    if(stat === 'fluxo') { valorAtual = personagemAtual.fluxo; max = personagemAtual.maxFluxo; }

    let novoValor = valorAtual + delta;
    if (novoValor > max) novoValor = max; 
    if (novoValor < 0) novoValor = 0;     

    if(stat === 'hp') personagemAtual.vitalidade = novoValor;
    if(stat === 'san') personagemAtual.sanidade = novoValor;
    if(stat === 'fluxo') personagemAtual.fluxo = novoValor;

    atualizarBarraVisual(stat, novoValor, max);
    salvarAlteracoesNoBanco();
};

window.changeStress = function(delta) {
    if(!personagemAtual) return;
    let novoValor = personagemAtual.estresse + delta;
    if (novoValor > 8) novoValor = 8;
    if (novoValor < 0) novoValor = 0;
    personagemAtual.estresse = novoValor;
    atualizarEstresseVisual(novoValor);
    salvarAlteracoesNoBanco();
};

window.changeGrau = function(delta) {
    if(!personagemAtual) return;

    let novoGrau = (parseInt(personagemAtual.grau) || 1) + delta;
    if(novoGrau < 1) novoGrau = 1;

    personagemAtual.grau = novoGrau;
    document.getElementById('grau-display').innerText = novoGrau;

    recalcularLimites();
    atualizarTodasAsBarras();
    salvarAlteracoesNoBanco();
};

// Inventário Dinâmico
function renderizarInventario() {
    const list = document.getElementById('inventory-list');
    list.innerHTML = '';
    
    personagemAtual.inventario.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'inv-item';
        div.innerHTML = `
            <input type="text" value="${item.nome}" class="inv-input-name" placeholder="Nome do Item" 
                onchange="atualizarItem(${index}, 'nome', this.value)">
            <input type="text" value="${item.slots}" class="inv-input-slot" placeholder="1 Slot" 
                onchange="atualizarItem(${index}, 'slots', this.value)">
            <button class="btn-remove" onclick="removerItem(${index})"><i class="fas fa-trash"></i></button>
        `;
        list.appendChild(div);
    });
}

window.addInventoryItem = function() {
    personagemAtual.inventario.push({ nome: "", slots: "" });
    renderizarInventario();
    salvarAlteracoesNoBanco();
};

window.atualizarItem = function(index, campo, valor) {
    personagemAtual.inventario[index][campo] = valor;
    salvarAlteracoesNoBanco();
};

window.removerItem = function(index) {
    personagemAtual.inventario.splice(index, 1);
    renderizarInventario();
    salvarAlteracoesNoBanco();
};

function salvarAlteracoesNoBanco() {
    let bancoDePersonagens = JSON.parse(localStorage.getItem('amestia_personagens')) || [];
    const index = bancoDePersonagens.findIndex(p => p.id == personagemAtual.id);
    if(index !== -1) {
        bancoDePersonagens[index] = personagemAtual;
        localStorage.setItem('amestia_personagens', JSON.stringify(bancoDePersonagens));
    }
}

function configurarAutoSave() {
    const mapeamentoTextos = [
        { id: 'ficha-nome', chave: 'nome' },
        { id: 'ficha-conceito', chave: 'conceito' },
        { id: 'ficha-ocupacao', chave: 'ocupacao' },
        { id: 'ficha-habilidade-inata', chave: 'habilidadeInata' }
    ];

    const mapeamentoAncoras = [
        { id: 'ancora-pessoa', chaveAnc: 'pessoa' },
        { id: 'ancora-lugar', chaveAnc: 'lugar' },
        { id: 'ancora-objeto', chaveAnc: 'objeto' }
    ];

    mapeamentoTextos.forEach(item => {
        const input = document.getElementById(item.id);
        if(input) {
            input.addEventListener('input', function() { 
                personagemAtual[item.chave] = this.value;
                salvarAlteracoesNoBanco();
            });
        }
    });

    mapeamentoAncoras.forEach(item => {
        const input = document.getElementById(item.id);
        if(input) {
            input.addEventListener('input', function() { 
                personagemAtual.ancorasLiterais[item.chaveAnc] = this.value;
                salvarAlteracoesNoBanco();
            });
        }
    });
}
    </script>
</body>
</html>
